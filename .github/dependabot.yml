version: 2
updates:
  # the synced workflows as well as the build repository's own, see README.md
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: cargo
    directory: "/tools"
    schedule:
      interval: daily
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: daily
