[workspace]
resolver = "2"
members = [
    "components/greeter",
    "crates/hello",
]

[workspace.package]
version = "0.1.0-dev"

[workspace.dependencies]
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.component-debug]
inherits = "dev"
opt-level = 1        # most of the size win; locals mostly still visible
lto = true
codegen-units = 1
incremental = false  # no benefit with one codegen unit
debug = "full"       # variables and types for lldb, file:line in backtraces
# kept from dev: debug-assertions, overflow-checks, no strip
