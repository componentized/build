# The cli tools this repository uses besides those the build provides in build/tools/Cargo.toml,
# installed by `make tools` with cargo binstall. A tool the build provides is overridden here with a
# newer version, `make update-build` removes the override once the build pins that version or newer.
#
# This package is never built, it lists the tools as dependencies so dependabot bumps them. Each
# tool is pinned to an exact version with `=`, the Makefile installs that version.
[package]
name = "tools"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "lib.rs"

# the binaries each tool installs, the Makefile runs each by path from a variable named after it,
# e.g. `$(WASMTIME)` for `wasmtime-cli`
[package.metadata.bins]
wasmtime-cli = ["wasmtime"]

[dependencies]
wasmtime-cli = "=50.0.1"

# not a member of the repository's workspace
[workspace]
